<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ဆိုင်ကယ်ဆိုင် ပစ္စည်းစာရင်း</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><button type="button" class="menu-btn" id="menu-open" aria-label="Menu" aria-controls="nav" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 data-t="title"></h1><span class="tag" data-t="demo" id="modetag"></span><button type="button" class="tag sync" id="sync" hidden></button></div>
    <div class="lang" role="group" aria-label="Language / ဘာသာစကား / ภาษา">
      <button type="button" data-lang="my" aria-pressed="true">မြန်မာ</button>
      <button type="button" data-lang="th" aria-pressed="false">ไทย</button>
    </div>
  </header>

  <div class="nav-scrim" id="nav-scrim" hidden></div>
  <nav class="nav" id="nav" aria-label="Menu">
    <div class="nav-head"><b data-t="title"></b><button type="button" class="menu-btn" id="nav-close" aria-label="Close">✕</button></div>
    <button type="button" class="nav-btn" data-tab="sales"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11h10.6L20.5 8H6.2"/></svg><span data-t="tabSales"></span></button>
    <button type="button" class="nav-btn" data-tab="purchase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg><span data-t="tabPurchase"></span></button>
    <button type="button" class="nav-btn" data-tab="receipts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span data-t="tabReceipts"></span><svg class="nav-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="nav-sub" id="nav-rsub" hidden>
      <button type="button" class="nav-btn" data-rnav="sales"><span data-t="tabSales"></span></button>
      <button type="button" class="nav-btn" data-rnav="purchase"><span data-t="tabPurchase"></span></button>
    </div>
    <button type="button" class="nav-btn" data-tab="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5"/><path d="M12 12v9"/></svg><span data-t="tabProducts"></span></button>
  </nav>


  <div id="view-products" class="view">
  <button type="button" class="fab" id="fab-add" data-psub="add" aria-label="+" hidden>+</button>
  <div class="phome" id="phome">
    <button type="button" class="pbig primary" data-psub="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-t="pAddBtn"></span></button>
    <button type="button" class="pbig" data-psub="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-t="pViewBtn"></span><b id="pcount"></b></button>
  </div>
  <div class="psubbar" id="psubbar" hidden>
    <button type="button" class="btn" data-psub="home">← <span data-t="back"></span></button>
    <span class="sp"></span>
    <button type="button" class="btn link" data-psub="add" id="pb-add"><span data-t="pAddBtn"></span></button>
    <button type="button" class="btn link" data-psub="list" id="pb-list"><span data-t="pViewBtn"></span></button>
  </div>
  <div id="psec-add" class="psec" hidden>
  <form id="qa" class="card qa" autocomplete="off" aria-labelledby="qa-title">
    <h2 id="qa-title" data-t="quickAdd"></h2>
    <div class="qa-grid">
      <label class="f f-name"><span data-t="name"></span><input id="qa-n" type="text"></label>
      <div class="f f-cat"><span data-t="category"></span>
        <select id="qa-c" aria-label="Category"></select>
        <input id="qa-nc" type="text" hidden data-tp="newCatPh" aria-label="New category">
      </div>
      <label class="f"><span data-t="cost"></span><input id="qa-k" class="num" inputmode="decimal"></label>
      <label class="f"><span data-t="price"></span><input id="qa-p" class="num" inputmode="decimal" data-tp="priceVar"></label>
      <label class="f" id="qa-s-wrap"><span data-t="stock"></span><input id="qa-s" class="num" inputmode="numeric"></label>
      <label class="f"><span data-t="skuLbl"></span><input id="qa-d" type="text" inputmode="numeric"></label>
      <label class="f f-img"><span data-t="photo"></span><input id="qa-img" type="file" accept="image/*"></label>
      <button class="btn primary" type="submit" data-t="add"></button>
    </div>
    <div class="qa-opts">
      <span class="hint" id="qa-hint" role="status" data-t="priceHint"></span>
    </div>
  </form>
  </div>

  <div id="psec-list" class="psec" hidden>
  <div class="search"><input id="q" type="search" data-tp="searchPh" aria-label="Search"></div>
  <div class="chips cats" id="cats" role="group"></div>
  <div class="rowline">
    <div class="chips" id="flags" role="group"></div>
    <span class="sp"></span>
    <button type="button" class="chip link" id="mgr-open" data-t="manageCats"></button>
  </div>

  <section class="card listcard cols" aria-live="polite">
    <div class="listhead"><span id="count"></span></div>
    <div class="head" id="head"></div>
    <div id="list"></div>
  </section>
  </div>
  </div>

  <div id="view-sales" class="view" hidden>
    <div class="cartbar" id="cartbar" hidden><span id="cb-sum"></span><button type="button" class="btn" id="cb-go"><span data-t="viewCart"></span><b id="cb-cnt"></b></button><button type="button" class="btn primary" id="cb-sell"><span data-t="sell"></span><b id="cb-amt"></b></button></div>
    <div class="sales-grid">
      <div class="s-head">
        <div class="search"><input id="sq" type="search" data-tp="salesSearchPh" aria-label="Search">
          <select id="scat-quick" class="search-cat" aria-label="Category"></select>
        </div>
      </div>
      <aside class="card s-cart" id="cart" aria-label="Cart">
        <div class="cart-head"><h2 data-t="cartTitle"></h2><button type="button" class="btn cart-close" id="cart-close" aria-label="Close">✕</button></div>
        <div id="cart-lines"></div>
        <div class="totals">
          <div class="t-row big"><span data-t="total"></span><b id="c-total">฿0</b></div>
          <label class="t-row"><span data-t="received"></span><input id="rcv" class="num" inputmode="decimal"></label>
          <div class="t-row" id="chg-row" hidden><span data-t="change"></span><b id="c-change"></b></div>
        </div>
        <div class="hint warn" id="c-msg" hidden></div>
        <button type="button" class="btn primary big" id="sell" data-t="sell"></button>
        <div class="lastsale" id="lastsale" hidden></div>
      </aside>
      <section class="card s-list" aria-live="polite"><div id="pick"></div></section>
      <div class="s-cats">
        <div class="catrow"><div class="chips cats" id="scats" role="group"></div><button type="button" class="chip" id="scat-toggle" aria-expanded="false" aria-controls="scats" aria-label="Categories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
      </div>
      <section class="card s-hist">
        <div class="listhead"><b data-t="todaySales"></b><span id="hist-sum"></span></div>
        <div id="hist"></div>
      </section>
    </div>
  </div>

  <div id="view-purchase" class="view" hidden>
    <section class="card pitems">
      <h2 class="ph" data-t="pTitle"></h2>
      <div class="pgrid">
        <label class="fld"><span data-t="supplier"></span><input id="p-sup" list="p-suplist" autocomplete="off"><datalist id="p-suplist"></datalist></label>
        <label class="fld"><span data-t="pDate"></span><input id="p-date" type="date"></label>
        <label class="fld"><span data-t="pTime"></span><input id="p-time" type="time"></label>
        <label class="fld"><span data-t="pRef"></span><input id="p-ref" autocomplete="off"></label>
        <label class="fld"><span data-t="pWho"></span><input id="p-who" autocomplete="off"></label>
      </div>
      <div class="search"><input id="pq" type="search" data-tp="pSearchPh" autocomplete="off" aria-label="Search"></div>
      <div id="pres" class="pres" hidden></div>
      <div id="p-lines"></div>
      <div class="totals"><div class="t-row big"><span data-t="total"></span><b id="p-total">฿0</b></div></div>
      <div class="hint warn" id="p-msg" hidden></div>
      <p class="hint" data-t="pNote"></p>
      <button type="button" class="btn primary big" id="p-save" data-t="pSave"></button>
      <div class="lastsale" id="p-last" hidden></div>
    </section>
    <section class="card s-hist">
      <div class="listhead"><b data-t="pHist"></b><span id="p-histsum"></span></div>
      <div id="p-hist"></div>
    </section>
  </div>

  <div id="view-receipts" class="view" hidden>
    <section class="card">
      <h2 class="ph" data-t="tabReceipts"></h2>
      <div class="chips rsubbar" id="rsubbar" role="group" aria-label="Receipts">
        <button type="button" class="chip" data-rsub="sales" aria-pressed="true" data-t="rSales"></button>
        <button type="button" class="chip" data-rsub="purchase" aria-pressed="false" data-t="rPurchase"></button>
      </div>
      <div class="search"><input id="r-q" type="search" data-tp="rSearchPh" aria-label="Search"></div>
      <div class="listhead"><b id="r-title"></b><span id="r-sum"></span></div>
      <div id="r-list"></div>
    </section>
  </div>

  <div class="foot">
    <span class="sp" data-t="demoNote"></span>
    <button type="button" class="btn" id="export" data-t="exportCsv"></button>
    <button type="button" class="btn" id="reset" data-t="reset"></button>
  </div>
</div>

<div class="scrim" id="mgr" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mgr-title">
    <h2 id="mgr-title" data-t="manageCats"></h2>
    <div class="addrow">
      <input id="mgr-new" type="text" data-tp="newCatPh" aria-label="New category">
      <button type="button" class="btn primary" id="mgr-add" data-t="addCat"></button>
    </div>
    <div class="mlist" id="mgr-list"></div>
    <div class="hint" data-t="catDelNote"></div>
    <button type="button" class="btn" id="mgr-close" data-t="close"></button>
  </div>
</div>
<div class="scrim" id="vch" hidden>
  <div class="dlg rcp" role="dialog" aria-modal="true" aria-labelledby="vch-title">
    <div id="vch-body"></div>
    <div class="addrow">
      <button type="button" class="btn" id="vch-copy" data-t="copyText"></button>
      <button type="button" class="btn primary" id="vch-close" data-t="close"></button>
    </div>
  </div>
</div>
<div class="cart-scrim" id="cart-scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="img-file" accept="image/*" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
